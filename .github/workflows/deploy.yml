name: Deploy

# M0 asks for a Pages deploy on push. Note that GitHub Pages on a *private*
# repo requires a paid plan — on a free account this workflow builds and tests
# fine but the deploy step will fail. The repo has to stay private (the LimeZu
# licence forbids redistribution), so if Pages is not available, publish the
# built `dist/` somewhere private instead. Only `dist/` ever ships: it contains
# the packed atlas, never `assets/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
