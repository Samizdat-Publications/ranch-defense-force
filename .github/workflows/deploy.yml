name: Deploy

# M0 asks for a Pages deploy on push.
#
# This was blocked for two milestones: Pages on a private repo needs a paid
# plan, and the repo was private because the LimeZu licence forbids
# redistributing the packs. The owner obtained permission from LimeZu to
# publish, so the repo is public and this now runs end to end.
#
# `npm run atlas` is NOT optional here. It slices `assets/` into
# `public/atlas.png`, which is gitignored precisely so generated art never
# lands in a commit — which means a checkout has no atlas at all, and a build
# that skips this step deploys a game that renders every sprite as a coloured
# square. Only `dist/` is published, and it contains the packed atlas rather
# than the source packs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run atlas
      - run: npx tsc --noEmit
      - run: npx tsc -p tools --noEmit
      - run: npx vitest run
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The action versions matter. GitHub now forces Node 20 actions onto Node 24,
  # and deploy-pages@v4 fails there with "HttpError: self-signed certificate"
  # before it uploads anything. The v5 line is the Node 24 build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
