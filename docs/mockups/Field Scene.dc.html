<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes fStrip384 { from { background-position: 0 0; } to { background-position: -384px 0; } }
  @keyframes fStrip192 { from { background-position: 0 0; } to { background-position: -192px 0; } }
  @keyframes fStrip128 { from { background-position: 0 0; } to { background-position: -128px 0; } }
  @keyframes fCross { 0% { transform: translateX(0); } 100% { transform: translateX(2260px); } }
  @keyframes fCloud { from { transform: translateX(0); } to { transform: translateX(-560px); } }
  @keyframes fCrop { 0%, 100% { transform: skewX(-1.4deg); } 50% { transform: skewX(1.4deg); } }
  @keyframes fCropSlow { 0%, 100% { transform: skewX(-0.8deg); } 50% { transform: skewX(0.8deg); } }
  @keyframes fSway { 0%, 100% { transform: rotate(-1.8deg); } 50% { transform: rotate(1.8deg); } }
  @keyframes fTractor { 0% { transform: translateX(0); } 100% { transform: translateX(-2280px); } }
  @keyframes fHorizon { 0% { transform: translateX(0); } 100% { transform: translateX(-460px); } }
  @keyframes fHorizonBack { 0% { transform: translateX(0) scaleX(-1); } 100% { transform: translateX(380px) scaleX(-1); } }
  @keyframes fBird { 0% { opacity: 0; transform: translate(0,0); } 8% { opacity: 0.7; } 88% { opacity: 0.7; } 100% { opacity: 0; transform: translate(var(--bx,-1200px), var(--by,-40px)); } }
  @keyframes fFlap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
  @keyframes fDust { 0% { opacity: 0; transform: translate(0,0) scale(0.6); } 25% { opacity: 0.32; } 100% { opacity: 0; transform: translate(46px, -18px) scale(2.4); } }
  @keyframes fShimmer { 0%, 100% { opacity: 0.16; transform: translateY(0); } 50% { opacity: 0.26; transform: translateY(-2px); } }
  @keyframes fSmoke { 0% { opacity: 0; transform: translate(0,0) scale(0.5); } 20% { opacity: 0.45; } 100% { opacity: 0; transform: translate(-34px,-120px) scale(2); } }
  @keyframes fFly { 0% { opacity: 0; transform: translate(0,0); } 22% { opacity: 1; } 72% { opacity: 0.9; } 100% { opacity: 0; transform: translate(var(--fx,60px), var(--fy,-80px)); } }
  @keyframes fSun { 0%, 100% { opacity: 1; } 47% { opacity: 0.88; } 52% { opacity: 1; } }
</style>
</helmet>

<div style="position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #1d2140 0%, #383455 16%, #6b4a52 30%, #b0705a 40%, #e5a75f 47%, #f8d894 52%, #cfa96f 56%, #7a7645 60%, #4a5330 100%);">

  <div style="position: absolute; left: 660px; top: 400px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, #fff6d4 0%, #ffd67e 28%, rgba(255,176,92,0) 66%); animation: fSun 9s ease-in-out infinite;"></div>

  <div style="position: absolute; left: 0; top: 120px; width: 3040px; height: 26px; opacity: 0.2; filter: blur(4px); background: repeating-linear-gradient(90deg, rgba(255,222,192,0.55) 0 220px, transparent 220px 500px); animation: fCloud 150s linear infinite;"></div>
  <div style="position: absolute; left: 0; top: 224px; width: 3040px; height: 18px; opacity: 0.18; filter: blur(3px); background: repeating-linear-gradient(90deg, rgba(255,210,172,0.6) 0 140px, transparent 140px 400px); animation: fCloud 104s linear infinite;"></div>
  <div style="position: absolute; left: 0; top: 322px; width: 3040px; height: 12px; opacity: 0.16; filter: blur(2px); background: repeating-linear-gradient(90deg, rgba(255,198,152,0.65) 0 100px, transparent 100px 320px); animation: fCloud 76s linear infinite;"></div>

  <!-- treeline haze -->
  <div style="position: absolute; left: 0; right: 0; top: 486px; height: 110px; background: linear-gradient(180deg, rgba(46,40,44,0) 0%, rgba(40,36,40,0.55) 60%, rgba(34,32,34,0.8) 100%); filter: blur(2px);"></div>

  <!-- the far end of the place, at 1x on the horizon line -->
  <div style="position: absolute; left: -40px; right: -40px; top: 486px; height: 82px; opacity: 0.5; filter: blur(3px); background: radial-gradient(58px 46px at 60px 100%, #2c3a24 0 62%, transparent 64%), radial-gradient(74px 58px at 190px 100%, #26331f 0 62%, transparent 64%), radial-gradient(52px 40px at 300px 100%, #2c3a24 0 62%, transparent 64%), radial-gradient(86px 62px at 430px 100%, #223019 0 62%, transparent 64%), radial-gradient(60px 44px at 560px 100%, #2c3a24 0 62%, transparent 64%); background-repeat: repeat-x; background-size: 640px 82px;"></div>
  <img src="art/scene/tree_oak.png" width="250" height="212" alt="" style="position: absolute; left: 900px; top: 352px; filter: brightness(0.7) saturate(0.72);" />
  <img src="art/scene/tree_oak.png" width="250" height="212" alt="" style="position: absolute; left: 1560px; top: 352px; filter: brightness(0.68) saturate(0.7);" />
  <img src="art/scene/silo.png" width="224" height="448" alt="" style="position: absolute; left: 1672px; top: 116px; opacity: 0.94; filter: blur(0.6px);" />
  <img src="art/scene/barn.png" width="480" height="224" alt="barn" style="position: absolute; left: 1208px; top: 340px; opacity: 0.94; filter: blur(0.6px);" />
  <img src="art/scene/house.png" width="256" height="320" alt="" style="position: absolute; left: 560px; top: 244px; opacity: 0.9; filter: blur(0.6px);" />

  <div style="position: absolute; left: 0; right: 0; top: 564px; bottom: 0; background: linear-gradient(180deg, #6b6338 0%, #5a5531 22%, #454026 54%, #2e2b1a 82%, #201e13 100%);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 564px; height: 16px; background: linear-gradient(180deg, rgba(248,206,138,0.5), transparent);"></div>

  <!-- the far end of the place, still working: hens at the barn, hands crossing the yard -->
  <img src="art/scene/farmer_idle.png" width="32" height="64" alt="" style="position: absolute; left: 1392px; top: 508px;" />
  <img src="art/scene/farmer2_idle.png" width="32" height="64" alt="" style="position: absolute; left: 1436px; top: 512px;" />
  <div style="position: absolute; left: 1660px; top: 508px; animation: fHorizon 92s linear infinite;">
    <div style="width: 32px; height: 64px; background-image: url('art/scene/farmer_walk_strip.png'); background-size: 192px 64px; background-repeat: no-repeat; animation: fStrip192 1.2s steps(6) infinite;"></div>
  </div>
  <div style="position: absolute; left: 540px; top: 512px; animation: fHorizonBack 118s linear infinite;">
    <div style="width: 32px; height: 64px; background-image: url('art/scene/farmer_walk_strip.png'); background-size: 192px 64px; background-repeat: no-repeat; animation: fStrip192 1.34s steps(6) infinite;"></div>
  </div>

  <div style="position: absolute; left: 1350px; top: 542px; width: 32px; height: 32px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 128px 32px; background-repeat: no-repeat; animation: fStrip128 2.4s steps(4) infinite;"></div>
  <div style="position: absolute; left: 1386px; top: 548px; width: 32px; height: 32px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 128px 32px; background-repeat: no-repeat; animation: fStrip128 3.1s steps(4) infinite 0.7s;"></div>
  <div style="position: absolute; left: 1478px; top: 544px; width: 32px; height: 32px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 128px 32px; background-repeat: no-repeat; animation: fStrip128 2.8s steps(4) infinite 1.5s;"></div>
  <div style="position: absolute; left: 1560px; top: 540px; width: 32px; height: 32px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 128px 32px; background-repeat: no-repeat; animation: fStrip128 3.4s steps(4) infinite 2.2s;"></div>
  <div style="position: absolute; left: 1700px; top: 540px; animation: fHorizon 140s linear infinite 8s;">
    <div style="width: 32px; height: 32px; background-image: url('art/scene/chicken_walk_left_strip.png'); background-size: 192px 32px; background-repeat: no-repeat; animation: fStrip192 1.3s steps(6) infinite;"></div>
  </div>
  <div style="position: absolute; left: 1620px; top: 552px; animation: fHorizon 116s linear infinite 24s;">
    <div style="width: 32px; height: 32px; background-image: url('art/scene/chicken_walk_left_strip.png'); background-size: 192px 32px; background-repeat: no-repeat; animation: fStrip192 1.5s steps(6) infinite;"></div>
  </div>

  <!-- heat still coming off the ground at the horizon -->
  <div style="position: absolute; left: 0; right: 0; top: 552px; height: 26px; background: linear-gradient(180deg, rgba(255,222,170,0.5), transparent); filter: blur(3px); animation: fShimmer 6.5s ease-in-out infinite; pointer-events: none;"></div>

  <!-- birds, high and far off -->
  <div style="position: absolute; left: 1980px; top: 196px; --bx: -2300px; --by: 60px; animation: fBird 74s linear infinite;">
    <div style="width: 7px; height: 3px; border-top: 2px solid rgba(28,24,26,0.75); border-radius: 50% 50% 0 0; animation: fFlap 0.9s ease-in-out infinite;"></div>
  </div>
  <div style="position: absolute; left: 2020px; top: 232px; --bx: -2340px; --by: 34px; animation: fBird 88s linear infinite 6s;">
    <div style="width: 6px; height: 3px; border-top: 2px solid rgba(28,24,26,0.7); border-radius: 50% 50% 0 0; animation: fFlap 1.1s ease-in-out infinite;"></div>
  </div>
  <div style="position: absolute; left: 2060px; top: 168px; --bx: -2380px; --by: 84px; animation: fBird 102s linear infinite 15s;">
    <div style="width: 8px; height: 4px; border-top: 2px solid rgba(28,24,26,0.65); border-radius: 50% 50% 0 0; animation: fFlap 1.3s ease-in-out infinite;"></div>
  </div>

  <!-- the field itself: crop rows, nearer rows taller and slower, phases offset so the tiling does not read as wallpaper -->
  <div style="position: absolute; left: -32px; right: -32px; top: 574px; height: 64px; opacity: 0.9; background-image: url('art/scene/wheat.png'); background-size: 64px 64px; background-repeat: repeat-x; background-position: -50px 0; transform-origin: 50% 100%; animation: fCrop 5.2s ease-in-out infinite;"></div>
  <div style="position: absolute; left: -32px; right: -32px; top: 636px; height: 64px; opacity: 0.62; background-image: url('art/scene/wheat.png'); background-size: 64px 64px; background-repeat: repeat-x; background-position: -36px 0; transform-origin: 50% 100%; animation: fCrop 5.9s ease-in-out infinite 0.7s;"></div>
  <div style="position: absolute; left: -32px; right: -32px; top: 700px; height: 96px; opacity: 0.92; background-image: url('art/scene/wheat2.png'); background-size: 96px 96px; background-repeat: repeat-x; background-position: -36px 0; transform-origin: 50% 100%; animation: fCrop 6.4s ease-in-out infinite;"></div>
  <div style="position: absolute; left: -32px; right: -32px; top: 806px; height: 96px; opacity: 0.55; background-image: url('art/scene/wheat2.png'); background-size: 96px 96px; background-repeat: repeat-x; background-position: -10px 0; transform-origin: 50% 100%; filter: blur(1.2px); animation: fCropSlow 7.1s ease-in-out infinite 1.2s;"></div>
  <div style="position: absolute; left: -32px; right: -32px; top: 902px; height: 128px; opacity: 0.95; background-image: url('art/scene/wheat2.png'); background-size: 128px 128px; background-repeat: repeat-x; background-position: -42px 0; transform-origin: 50% 100%; filter: blur(2.6px); animation: fCropSlow 8.3s ease-in-out infinite;"></div>

  <!-- the tractor working the row -->
  <div style="position: absolute; left: 1980px; top: 596px; animation: fTractor 76s linear infinite;">
    <img src="art/scene/tractor_left.png" width="160" height="114" alt="tractor" style="position: relative;" />
    <div style="position: absolute; left: 26px; top: -14px; width: 14px; height: 14px; border-radius: 50%; background: rgba(90,80,70,0.5); filter: blur(4px); animation: fSmoke 3.4s linear infinite;"></div>
    <div style="position: absolute; left: 26px; top: -14px; width: 17px; height: 17px; border-radius: 50%; background: rgba(90,80,70,0.42); filter: blur(5px); animation: fSmoke 3.4s linear infinite 1.7s;"></div>
    <div style="position: absolute; left: 128px; top: 92px; width: 20px; height: 12px; border-radius: 50%; background: rgba(176,152,110,0.6); filter: blur(3px); animation: fDust 2.2s linear infinite;"></div>
    <div style="position: absolute; left: 132px; top: 96px; width: 26px; height: 14px; border-radius: 50%; background: rgba(176,152,110,0.5); filter: blur(4px); animation: fDust 2.2s linear infinite 1.1s;"></div>
  </div>
  <img src="art/scene/scarecrow.png" width="96" height="96" alt="scarecrow" style="position: absolute; left: 640px; top: 522px; transform-origin: 50% 92%; animation: fSway 6.6s ease-in-out infinite;" />
  <img src="art/scene/hay.png" width="64" height="32" alt="" style="position: absolute; left: 700px; top: 606px;" />

  <!-- somebody walking the row -->
  <div style="position: absolute; left: -180px; top: 662px; animation: fCross 96s linear infinite;">
    <div style="width: 64px; height: 128px; background-image: url('art/scene/farmer_walk_strip.png'); background-size: 384px 128px; background-repeat: no-repeat; animation: fStrip384 1.12s steps(6) infinite;"></div>
  </div>

  <div style="position: absolute; left: 480px; top: 880px; width: 5px; height: 5px; border-radius: 50%; background: #ffe9a0; box-shadow: 0 0 10px 3px rgba(255,220,130,0.7); --fx: 80px; --fy: -130px; animation: fFly 11s ease-in-out infinite;"></div>
  <div style="position: absolute; left: 1420px; top: 840px; width: 6px; height: 6px; border-radius: 50%; background: #ffe9a0; box-shadow: 0 0 11px 3px rgba(255,220,130,0.7); --fx: -60px; --fy: -160px; animation: fFly 13s ease-in-out infinite 3s;"></div>

  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 76% at 50% 52%, transparent 40%, rgba(12,10,14,0.5) 100%);"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,9,14,0.42) 0%, transparent 20%, transparent 54%, rgba(10,9,8,0.7) 100%);"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}"></script>
</body>
</html>
