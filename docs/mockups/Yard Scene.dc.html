<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @keyframes yStrip384 { from { background-position: 0 0; } to { background-position: -384px 0; } }
  @keyframes yStrip256 { from { background-position: 0 0; } to { background-position: -256px 0; } }
  @keyframes yCross { 0% { transform: translateX(0); } 100% { transform: translateX(-2260px); } }
  @keyframes yUp { 0% { transform: translateY(0); } 100% { transform: translateY(-460px); } }
  @keyframes yAcross { 0% { transform: translateX(0); } 100% { transform: translateX(830px); } }
  @keyframes yCloud { from { transform: translateX(0); } to { transform: translateX(-560px); } }
  @keyframes yPorch { 0%, 42% { opacity: 0; } 47% { opacity: 0.85; } 49% { opacity: 0.2; } 52%, 100% { opacity: 1; } }
  @keyframes ySmoke { 0% { opacity: 0; transform: translate(0,0) scale(0.5); } 18% { opacity: 0.5; } 100% { opacity: 0; transform: translate(46px,-160px) scale(2.2); } }
  @keyframes yFly { 0% { opacity: 0; transform: translate(0,0); } 22% { opacity: 1; } 72% { opacity: 0.9; } 100% { opacity: 0; transform: translate(var(--fx,60px), var(--fy,-80px)); } }
  @keyframes ySway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
  @keyframes yBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes ySun { 0%, 100% { opacity: 1; } 47% { opacity: 0.88; } 52% { opacity: 1; } }
</style>
</helmet>

<div style="position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #191b36 0%, #302e4a 18%, #5d454f 33%, #a2685a 44%, #dc9f5c 52%, #f4cd88 57%, #c9a06a 61%, #6a6b41 66%, #3f4a2c 100%);">

  <div style="position: absolute; left: 792px; top: 372px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, #fff6d6 0%, #ffd884 26%, rgba(255,176,92,0) 66%); animation: ySun 9s ease-in-out infinite;"></div>
  <div style="position: absolute; left: 896px; top: 476px; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle, #fffbe8 0%, #ffe6a2 58%, rgba(255,214,124,0) 100%); animation: ySun 9s ease-in-out infinite;"></div>

  <div style="position: absolute; left: 0; top: 128px; width: 3040px; height: 30px; opacity: 0.22; filter: blur(4px); background: repeating-linear-gradient(90deg, rgba(255,220,190,0.55) 0 200px, transparent 200px 470px); animation: yCloud 140s linear infinite;"></div>
  <div style="position: absolute; left: 0; top: 232px; width: 3040px; height: 20px; opacity: 0.2; filter: blur(3px); background: repeating-linear-gradient(90deg, rgba(255,208,170,0.6) 0 130px, transparent 130px 380px); animation: yCloud 96s linear infinite;"></div>
  <div style="position: absolute; left: 0; top: 338px; width: 3040px; height: 14px; opacity: 0.18; filter: blur(2px); background: repeating-linear-gradient(90deg, rgba(255,196,150,0.65) 0 90px, transparent 90px 300px); animation: yCloud 70s linear infinite;"></div>

  <div style="position: absolute; left: 0; right: 0; top: 512px; height: 120px; background: linear-gradient(180deg, rgba(58,46,52,0) 0%, rgba(46,38,44,0.5) 62%, rgba(40,34,38,0.78) 100%); filter: blur(2px);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 620px; bottom: 0; background: linear-gradient(180deg, #575c33 0%, #454c2b 20%, #333a21 50%, #23281a 78%, #191d13 100%);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 620px; height: 18px; background: linear-gradient(180deg, rgba(244,196,126,0.48), transparent);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 620px; bottom: 0; opacity: 0.3; background-image: repeating-linear-gradient(92deg, rgba(0,0,0,0.3) 0 4px, transparent 4px 13px);"></div>

  <!-- track to the barn doors -->
  <div style="position: absolute; left: 900px; top: 630px; width: 760px; height: 450px; background: linear-gradient(180deg, #6a5a3c 0%, #7b6945 36%, #6b5a3a 100%); clip-path: polygon(46% 0, 55% 0, 100% 100%, 0 100%); opacity: 0.72;"></div>

  <!-- treeline: canopies breaking the roofline, trunks hidden behind the buildings -->
  <img src="art/scene/tree_oak.png" width="250" height="212" alt="" style="position: absolute; left: 1150px; top: 300px; filter: brightness(0.84) saturate(0.86);" />
  <img src="art/scene/tree_oak.png" width="250" height="212" alt="" style="position: absolute; left: 1420px; top: 282px; filter: brightness(0.8) saturate(0.82);" />
  <img src="art/scene/tree_oak.png" width="250" height="212" alt="" style="position: absolute; left: 596px; top: 268px; filter: brightness(0.82) saturate(0.84);" />

  <!-- distant buildings at 1x, the foreground silo at 2x -->
  <img src="art/scene/silo.png" width="224" height="448" alt="" style="position: absolute; left: 1664px; top: 192px;" />

  <div style="position: absolute; left: 1096px; top: 410px; width: 480px; height: 224px;">
    <img src="art/scene/barn.png" width="480" height="224" alt="barn" style="position: absolute; inset: 0;" />
    <!-- doorway -->
    <div style="position: absolute; left: 196px; top: 148px; width: 92px; height: 76px; cursor: pointer;" style-hover="filter: brightness(1.4);">
      <div style="position: absolute; inset: -10px; background: radial-gradient(60% 60% at 50% 62%, rgba(255,206,120,0.6), transparent 72%); animation: doorPulse 3.6s ease-in-out infinite;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 430px; top: 320px; width: 256px; height: 320px;">
    <img src="art/scene/house.png" width="256" height="320" alt="farmhouse" style="position: absolute; inset: 0;" />
    <div style="position: absolute; left: 146px; top: 226px; width: 104px; height: 104px; background: radial-gradient(circle, rgba(255,214,140,0.7) 0%, rgba(255,190,110,0.2) 42%, transparent 72%); animation: yPorch 11s ease-in-out infinite;"></div>
    <div style="position: absolute; left: 118px; top: 46px; width: 16px; height: 16px; border-radius: 50%; background: rgba(214,206,196,0.5); filter: blur(4px); animation: ySmoke 7.5s linear infinite;"></div>
    <div style="position: absolute; left: 118px; top: 46px; width: 19px; height: 19px; border-radius: 50%; background: rgba(214,206,196,0.42); filter: blur(5px); animation: ySmoke 7.5s linear infinite 2.5s;"></div>
    <div style="position: absolute; left: 118px; top: 46px; width: 13px; height: 13px; border-radius: 50%; background: rgba(214,206,196,0.46); filter: blur(3px); animation: ySmoke 7.5s linear infinite 5s;"></div>
  </div>

  <img src="art/scene/coop.png" width="128" height="160" alt="chicken coop" style="position: absolute; left: 800px; top: 478px;" />
  <img src="art/scene/nest.png" width="64" height="96" alt="" style="position: absolute; left: 936px; top: 542px;" />
  <img src="art/scene/scarecrow.png" width="96" height="96" alt="scarecrow" style="position: absolute; left: 968px; top: 546px; transform-origin: 50% 92%; animation: ySway 7.4s ease-in-out infinite;" />
  <img src="art/scene/well.png" width="96" height="64" alt="well" style="position: absolute; left: 1112px; top: 596px;" />
  <img src="art/scene/hay.png" width="64" height="32" alt="" style="position: absolute; left: 646px; top: 616px;" />
  <img src="art/scene/tree_oak.png" width="250" height="212" alt="" style="position: absolute; left: 1742px; top: 414px; filter: brightness(0.88);" />
  <img src="art/scene/doghouse.png" width="64" height="96" alt="" style="position: absolute; left: 722px; top: 552px;" />

  <!-- stock pen: rails, a gate, and what is standing in it -->
  <div style="position: absolute; left: 1596px; top: 646px; width: 324px; height: 74px;">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 26px; background-image: url('art/scene/pen_h.png'); background-size: 24px 26px; background-repeat: repeat-x; opacity: 0.92;"></div>
    <img src="art/scene/pen_c1.png" width="32" height="26" alt="" style="position: absolute; left: -4px; top: 0;" />
    <div style="position: absolute; left: 0; width: 132px; bottom: 0; height: 26px; background-image: url('art/scene/pen_h.png'); background-size: 24px 26px; background-repeat: repeat-x;"></div>
    <div style="position: absolute; right: 0; width: 108px; bottom: 0; height: 26px; background-image: url('art/scene/pen_h.png'); background-size: 24px 26px; background-repeat: repeat-x;"></div>
    <img src="art/scene/pen_gate.png" width="32" height="26" alt="" style="position: absolute; left: 138px; bottom: 0;" />
    <img src="art/scene/pen_v.png" width="16" height="32" alt="" style="position: absolute; left: -2px; top: 20px;" />
    <img src="art/scene/pen_v.png" width="16" height="32" alt="" style="position: absolute; right: -2px; top: 20px;" />
    <img src="art/scene/sign_cow.png" width="32" height="30" alt="" style="position: absolute; left: 96px; bottom: 14px;" />
  </div>
  <img src="art/scene/cow.png" width="90" height="54" alt="" style="position: absolute; left: 1628px; top: 658px; animation: yBob 5.4s ease-in-out infinite;" />
  <img src="art/scene/calf.png" width="52" height="40" alt="" style="position: absolute; left: 1746px; top: 672px; animation: yBob 3.1s ease-in-out infinite 0.6s;" />
  <img src="art/scene/sheep.png" width="52" height="34" alt="" style="position: absolute; left: 1826px; top: 678px; animation: yBob 4.2s ease-in-out infinite 1.4s;" />
  <img src="art/scene/trough.png" width="64" height="32" alt="" style="position: absolute; left: 1600px; top: 700px;" />

  <!-- actors at 2x -->
  <div style="position: absolute; left: 2000px; top: 664px; animation: yCross 132s linear infinite;">
    <div style="width: 64px; height: 64px; background-image: url('art/scene/chicken_walk_left_strip.png'); background-size: 384px 64px; background-repeat: no-repeat; animation: yStrip384 1.15s steps(6) infinite;"></div>
  </div>
  <div style="position: absolute; left: 2000px; top: 664px; animation: yCross 168s linear infinite 20s;">
    <div style="width: 64px; height: 64px; background-image: url('art/scene/chicken_walk_left_strip.png'); background-size: 384px 64px; background-repeat: no-repeat; animation: yStrip384 1.35s steps(6) infinite;"></div>
  </div>
  <div style="position: absolute; left: 856px; top: 676px; width: 64px; height: 64px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 256px 64px; background-repeat: no-repeat; animation: yStrip256 2s steps(4) infinite;"></div>
  <img src="art/scene/chick.png" width="64" height="64" alt="" style="position: absolute; left: 920px; top: 678px; animation: yBob 2.2s ease-in-out infinite;" />
  <img src="art/scene/rooster.png" width="64" height="64" alt="" style="position: absolute; left: 758px; top: 640px; animation: yBob 3.6s ease-in-out infinite;" />
  <div style="position: absolute; left: 992px; top: 660px; width: 64px; height: 64px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 256px 64px; background-repeat: no-repeat; animation: yStrip256 2.6s steps(4) infinite 0.8s;"></div>
  <div style="position: absolute; left: 1064px; top: 674px; width: 64px; height: 64px; background-image: url('art/scene/chicken_peck_strip.png'); background-size: 256px 64px; background-repeat: no-repeat; animation: yStrip256 3.1s steps(4) infinite 1.9s;"></div>

  <!-- a second hand crossing the yard, and the dog that follows him -->
  <div style="position: absolute; left: 470px; top: 566px; animation: yAcross 61s linear infinite;">
    <div style="width: 64px; height: 128px; background-image: url('art/scene/farmer_walk_strip.png'); background-size: 384px 128px; background-repeat: no-repeat; animation: yStrip384 1.1s steps(6) infinite;"></div>
  </div>

  <div style="position: absolute; left: 1290px; top: 1010px; animation: yUp 74s linear infinite;">
    <div style="width: 64px; height: 128px; background-image: url('art/scene/farmer_walk_up_strip.png'); background-size: 384px 128px; background-repeat: no-repeat; animation: yStrip384 1.05s steps(6) infinite;"></div>
  </div>

  <div style="position: absolute; left: -20px; right: -20px; top: 742px; height: 32px; background-image: url('art/scene/fence_picket.png'); background-size: 96px 32px; background-repeat: repeat-x; filter: brightness(0.62);"></div>

  <!-- nearest ground, in front of the fence -->
  <img src="art/scene/dog_lab.png" width="120" height="84" alt="" style="position: absolute; left: 132px; top: 818px; animation: yBob 2.4s ease-in-out infinite;" />
  <img src="art/scene/milkcan.png" width="48" height="64" alt="" style="position: absolute; left: 24px; top: 872px;" />
  <img src="art/scene/milkcan.png" width="48" height="64" alt="" style="position: absolute; left: 66px; top: 890px;" />

  <div style="position: absolute; left: 560px; top: 830px; width: 6px; height: 6px; border-radius: 50%; background: #ffe9a0; box-shadow: 0 0 10px 3px rgba(255,220,130,0.7); --fx: 90px; --fy: -120px; animation: yFly 9s ease-in-out infinite;"></div>
  <div style="position: absolute; left: 1240px; top: 860px; width: 5px; height: 5px; border-radius: 50%; background: #ffe9a0; box-shadow: 0 0 10px 3px rgba(255,220,130,0.7); --fx: -70px; --fy: -150px; animation: yFly 12s ease-in-out infinite 2s;"></div>
  <div style="position: absolute; left: 1660px; top: 800px; width: 6px; height: 6px; border-radius: 50%; background: #ffe9a0; box-shadow: 0 0 12px 3px rgba(255,220,130,0.7); --fx: 60px; --fy: -190px; animation: yFly 10.5s ease-in-out infinite 4s;"></div>
  <div style="position: absolute; left: 900px; top: 880px; width: 4px; height: 4px; border-radius: 50%; background: #ffe9a0; box-shadow: 0 0 9px 3px rgba(255,220,130,0.6); --fx: 120px; --fy: -100px; animation: yFly 14s ease-in-out infinite 1s;"></div>

  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 78% at 50% 56%, transparent 42%, rgba(12,10,14,0.52) 100%);"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,9,14,0.44) 0%, transparent 22%, transparent 56%, rgba(10,9,8,0.68) 100%);"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}"></script>
</body>
</html>
